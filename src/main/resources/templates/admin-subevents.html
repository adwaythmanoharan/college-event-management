<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Sub Events - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <div>
            <a href="/admin/dashboard" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/admin/logout" class="btn btn-light">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Sub Events</h2>

        <a href="/admin/subevents/add"
           class="btn btn-primary">
            + Add Sub Event
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Sub Event Name</th>
                    <th>Main Event ID</th>
                    <th>Capacity</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="subEvent : ${subEvents}">

                    <td th:text="${subEvent.subEventId}"></td>

                    <td th:text="${subEvent.subEventName}"></td>

                    <td th:text="${subEvent.eventId}"></td>

                    <td th:text="${subEvent.capacity}"></td>

                    <td>

                        <a th:href="@{/admin/subevents/edit(id=${subEvent.subEventId})}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a th:href="@{/admin/subevents/delete(id=${subEvent.subEventId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this sub-event?');">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
