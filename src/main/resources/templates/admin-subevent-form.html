<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sub Event - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <a href="/admin/subevents" class="btn btn-light">
            Back
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="mb-4"
                th:text="${subEvent.subEventId == 0 ? 'Add Sub Event' : 'Edit Sub Event'}">
                Add Sub Event
            </h2>

            <form th:action="${subEvent.subEventId == 0 ? '/admin/subevents/save' : '/admin/subevents/update'}"
                  method="post">

                <input type="hidden"
                       name="subEventId"
                       th:value="${subEvent.subEventId}">

                <div class="mb-3">

                    <label class="form-label">
                        Sub Event Name
                    </label>

                    <input type="text"
                           name="subEventName"
                           class="form-control"
                           th:value="${subEvent.subEventName}"
                           required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Main Event
                    </label>

                    label class="form-label">
        Maximum Participants
    </label>

    <input type="number"
           name="capacity"
           class="form-control"
           min="1"
           th:value="${subEvent.capacity}"
           required>


                    <select name="eventId"
                            class="form-select"
                            required>

                        <option value="">
                            Select Event
                        </option>

                        <option th:each="event : ${events}"
                                th:value="${event.eventId}"
                                th:text="${event.eventName}"
                                th:selected="${event.eventId == subEvent.eventId}">
                        </option>

                    </select>

                </div>

                <button type="submit"
                        class="btn btn-primary w-100"
                        th:text="${subEvent.subEventId == 0 ? 'Add Sub Event' : 'Update Sub Event'}">
                    Add Sub Event
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
