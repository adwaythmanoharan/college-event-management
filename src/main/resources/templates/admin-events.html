<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Events - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .event-image {
            width: 100px;
            height: 70px;
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <div>
            <a href="/admin/dashboard" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/admin/logout" class="btn btn-light">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Events</h2>

        <a href="/admin/events/add"
           class="btn btn-primary">
            + Add Event
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Event Name</th>
                    <th>Venue</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="event : ${events}">

                    <td th:text="${event.eventId}"></td>

                    <td>
                        <img th:src="${event.imageUrl}"
                             class="event-image"
                             alt="Event Image">
                    </td>

                    <td th:text="${event.eventName}"></td>

                    <td th:text="${event.venue}"></td>

                    <td>

                        <a th:href="@{/admin/events/edit(id=${event.eventId})}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a th:href="@{/admin/events/delete(id=${event.eventId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this event?');">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
