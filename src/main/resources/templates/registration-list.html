<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Registrations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand fw-bold" href="/event-list">
            CampusConnect
        </a>

        <a href="/event-list" class="btn btn-light btn-sm">
            Events
        </a>

    </div>
</nav>


<div class="container py-5">

    <h2 class="text-center mb-4">
        My Registrations
    </h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-striped table-hover">

                <thead>
                    <tr>
                        <th>Registration ID</th>
                        <th>Student ID</th>
                        <th>Event ID</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="registration : ${registrations}">

                        <td th:text="${registration.registrationId}">
                            1
                        </td>

                        <td th:text="${registration.studentId}">
                            1
                        </td>

                        <td th:text="${registration.eventId}">
                            1
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
