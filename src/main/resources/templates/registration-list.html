<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Registrations - CampusConnect</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- ================= CUSTOM CSS ================= -->

    <style>

        body {

            background: #f5f7fb;

            color: #1f2937;

        }


        /* ================================================= */
        /* PAGE HEADER */
        /* ================================================= */

        .page-header {

            padding-top: 35px;

            margin-bottom: 30px;

        }


        .page-title {

            font-size: 32px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .page-subtitle {

            color: #6b7280;

            font-size: 15px;

            margin-bottom: 0;

        }


        /* ================================================= */
        /* REGISTRATION CARD */
        /* ================================================= */

        .registration-card {

            background: white;

            border: none;

            border-radius: 17px;

            overflow: hidden;

            height: 100%;

            box-shadow:
                    0 4px 18px rgba(0, 0, 0, 0.06);

            transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;

        }


        .registration-card:hover {

            transform: translateY(-5px);

            box-shadow:
                    0 10px 28px rgba(0, 0, 0, 0.11);

        }


        /* ================================================= */
        /* EVENT IMAGE */
        /* ================================================= */

        .event-image-container {

            width: 100%;

            height: 190px;

            background: #eef1f5;

            overflow: hidden;

        }


        .event-image {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        /* ================================================= */
        /* CARD BODY */
        /* ================================================= */

        .registration-body {

            padding: 20px;

        }


        /* ================================================= */
        /* REGISTERED STATUS */
        /* ================================================= */

        .status-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;

        }


        .registered-badge {

            background: #d1fae5;

            color: #047857;

            padding: 6px 10px;

            border-radius: 7px;

            font-size: 12px;

            font-weight: 600;

        }


        /* ================================================= */
        /* EVENT NAME */
        /* ================================================= */

        .event-name {

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        /* ================================================= */
        /* VENUE */
        /* ================================================= */

        .venue {

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 18px;

        }


        /* ================================================= */
        /* ACTIVITY BOX */
        /* ================================================= */

        .activity-box {

            background: #f6f8fc;

            border: 1px solid #e9edf4;

            border-radius: 11px;

            padding: 13px 14px;

            margin-bottom: 16px;

        }


        .activity-label {

            color: #6b7280;

            font-size: 11px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.4px;

            margin-bottom: 4px;

        }


        .activity-name {

            font-size: 15px;

            font-weight: 600;

        }


        /* ================================================= */
        /* REGISTRATION ID */
        /* ================================================= */

        .registration-id {

            color: #8a94a6;

            font-size: 12px;

            margin-bottom: 18px;

        }


        /* ================================================= */
        /* CARD ACTIONS */
        /* ================================================= */

        .card-actions {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .unregister-button {

            border-radius: 8px;

            font-size: 13px;

            padding: 7px 12px;

        }


        /* ================================================= */
        /* EMPTY STATE */
        /* ================================================= */

        .empty-state {

            background: white;

            border-radius: 18px;

            padding: 70px 20px;

            text-align: center;

            box-shadow:
                    0 4px 18px rgba(0, 0, 0, 0.05);

        }


        .empty-icon {

            font-size: 52px;

            margin-bottom: 15px;

        }


        .empty-state h4 {

            font-weight: 700;

            margin-bottom: 8px;

        }


        .empty-state p {

            color: #6b7280;

            margin-bottom: 22px;

        }


        /* ================================================= */
        /* RESPONSIVE */
        /* ================================================= */

        @media (max-width: 768px) {

            .page-title {

                font-size: 28px;

            }

        }

    </style>

</head>


<body>


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<div th:replace="~{navbar :: studentNavbar}"></div>



<!-- ===================================================== -->
<!-- MAIN CONTENT -->
<!-- ===================================================== -->

<div class="container pb-5">


    <!-- ================================================= -->
    <!-- PAGE HEADER -->
    <!-- ================================================= -->

    <div class="page-header">

        <h1 class="page-title">

            My Registrations

        </h1>


        <p class="page-subtitle">

            Manage the college activities you have registered for.

        </p>

    </div>



    <!-- ================================================= -->
    <!-- NO REGISTRATIONS -->
    <!-- ================================================= -->

    <div th:if="${registrations == null || registrations.isEmpty()}"
         class="empty-state">


        <div class="empty-icon">

            📋

        </div>


        <h4>

            No Registrations Yet

        </h4>


        <p>

            You haven't registered for any activities yet.

        </p>


        <a href="/event-list"
           class="btn btn-primary">

            Browse Events →

        </a>

    </div>



    <!-- ================================================= -->
    <!-- REGISTRATION CARDS -->
    <!-- ================================================= -->

    <div th:if="${registrations != null && !registrations.isEmpty()}"
         class="row g-4">


        <!-- ================================================= -->
        <!-- EACH REGISTRATION -->
        <!-- ================================================= -->

        <div class="col-xl-4 col-md-6"
             th:each="registration : ${registrations}">


            <div class="registration-card">


                <!-- ================================================= -->
                <!-- EVENT IMAGE -->
                <!-- ================================================= -->

                <div th:each="event : ${events}"
                     th:if="${event.eventId == registration.eventId}"
                     class="event-image-container">


                    <img th:src="${event.imageUrl}"
                         class="event-image"
                         alt="Event Image">

                </div>



                <!-- ================================================= -->
                <!-- CARD BODY -->
                <!-- ================================================= -->

                <div class="registration-body">


                    <!-- ================================================= -->
                    <!-- STATUS -->
                    <!-- ================================================= -->

                    <div class="status-row">


                        <span class="registered-badge">

                            ✓ Registered

                        </span>


                    </div>



                    <!-- ================================================= -->
                    <!-- EVENT INFORMATION -->
                    <!-- ================================================= -->

                    <div th:each="event : ${events}"
                         th:if="${event.eventId == registration.eventId}">


                        <!-- EVENT NAME -->

                        <div class="event-name"
                             th:text="${event.eventName}">

                            Onam

                        </div>


                        <!-- VENUE -->

                        <div class="venue">

                            📍

                            <span th:text="${event.venue}">

                                MCA Hall

                            </span>

                        </div>

                    </div>



                    <!-- ================================================= -->
                    <!-- ACTIVITY -->
                    <!-- ================================================= -->

                    <div th:each="subEvent : ${subEvents}"
                         th:if="${subEvent.subEventId == registration.subEventId}"
                         class="activity-box">


                        <div class="activity-label">

                            Selected Activity

                        </div>


                        <div class="activity-name">

                            🎯

                            <span th:text="${subEvent.subEventName}">

                                Vadamvali

                            </span>

                        </div>

                    </div>



                    <!-- ================================================= -->
                    <!-- REGISTRATION ID -->
                    <!-- ================================================= -->

                    <div class="registration-id">

                        Registration ID:

                        <strong th:text="${registration.registrationId}">

                            1

                        </strong>

                    </div>



                    <!-- ================================================= -->
                    <!-- ACTIONS -->
                    <!-- ================================================= -->

                    <div class="card-actions">


                        <span class="text-muted small">

                            Active registration

                        </span>


                        <a th:href="@{/unregister/{id}(id=${registration.registrationId})}"

                           class="btn btn-outline-danger unregister-button"

                           onclick="return confirm('Are you sure you want to unregister from this activity?');">

                            Unregister

                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>


</div>



<!-- ===================================================== -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
