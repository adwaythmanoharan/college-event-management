<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Create Account</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body {

            background: #f5f7fb;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .register-card {

            width: 100%;

            max-width: 440px;

            background: white;

            border: none;

            border-radius: 20px;

            box-shadow:
                    0 10px 35px rgba(0, 0, 0, 0.08);

            overflow: hidden;

        }


        .register-header {

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #4f8dfd
            );

            color: white;

            text-align: center;

            padding: 30px;

        }


        .register-header h2 {

            font-weight: 700;

            margin-bottom: 6px;

        }


        .register-header p {

            margin: 0;

            opacity: 0.9;

            font-size: 14px;

        }


        .register-body {

            padding: 30px;

        }


        .form-label {

            font-weight: 600;

            font-size: 14px;

        }


        .form-control {

            border-radius: 9px;

            padding: 10px 12px;

        }


        .form-control:focus {

            box-shadow:
                    0 0 0 3px rgba(13, 110, 253, 0.12);

        }


        .register-button {

            width: 100%;

            padding: 11px;

            border-radius: 9px;

            font-weight: 600;

            margin-top: 8px;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

            font-size: 14px;

        }


        .login-link a {

            text-decoration: none;

            font-weight: 600;

        }

    </style>

</head>


<body>


<div class="register-card">


    <!-- ================= HEADER ================= -->

    <div class="register-header">

        <h2>

            Create Your Account

        </h2>

        <p>

            Register for your CampusConnect account

        </p>

    </div>



    <!-- ================= BODY ================= -->

    <div class="register-body">


        <!-- ================= SUCCESS ================= -->

        <div th:if="${success}"
             class="alert alert-success"
             th:text="${success}">

            Account created successfully.

        </div>


        <!-- ================= ERROR ================= -->

        <div th:if="${error}"
             class="alert alert-danger"
             th:text="${error}">

            Registration error.

        </div>



        <!-- ================= FORM ================= -->

        <form action="/student-register"
              method="post">


            <!-- ================= STUDENT ID ================= -->

            <div class="mb-3">

                <label for="studentId"
                       class="form-label">

                    Student ID

                </label>

                <input type="number"
                       class="form-control"
                       id="studentId"
                       name="studentId"
                       placeholder="Enter your Student ID"
                       required>

            </div>



            <!-- ================= STUDENT NAME ================= -->

            <div class="mb-3">

                <label for="studentName"
                       class="form-label">

                    Student Name

                </label>

                <input type="text"
                       class="form-control"
                       id="studentName"
                       name="studentName"
                       placeholder="Enter your full name"
                       required>

            </div>



            <!-- ================= PASSWORD ================= -->

            <div class="mb-3">

                <label for="password"
                       class="form-label">

                    Password

                </label>

                <input type="password"
                       class="form-control"
                       id="password"
                       name="password"
                       placeholder="Create a password"
                       required>

            </div>



            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="mb-3">

                <label for="confirmPassword"
                       class="form-label">

                    Confirm Password

                </label>

                <input type="password"
                       class="form-control"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Re-enter your password"
                       required>

            </div>



            <!-- ================= SUBMIT ================= -->

            <button type="submit"
                    class="btn btn-primary register-button">

                Create Account

            </button>


        </form>



        <!-- ================= LOGIN ================= -->

        <div class="login-link">

            Already have an account?

            <a href="/">

                Login

            </a>

        </div>


    </div>

</div>


</body>

</html>
