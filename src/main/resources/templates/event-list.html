<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Events</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/event-list">
            CampusConnect
        </a>

        <div>
            <a href="/event-list" class="btn btn-light btn-sm me-2">
                Events
            </a>

            <a href="#" class="btn btn-outline-light btn-sm">
                My Registrations
            </a>
        </div>
    </div>
</nav>


<!-- Main Content -->
<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold">Upcoming Events</h1>

        <p class="text-muted">
            Explore and register for college events.
        </p>
    </div>


    <!-- Event Cards -->
    <div class="row g-4">

        <div class="col-md-6 col-lg-4"
             th:each="event : ${events}">

            <div class="card h-100 shadow-sm border-0">

                <div class="card-body">

                    <h5 class="card-title fw-bold"
                        th:text="${event.eventName}">
                        Event Name
                    </h5>

                    <p class="card-text text-muted mb-2">
                        <strong>Event ID:</strong>
                        <span th:text="${event.eventId}">
                            1
                        </span>
                    </p>

                    <p class="card-text">
                        <strong>Venue:</strong>
                        <span th:text="${event.venue}">
                            Venue
                        </span>
                    </p>

                    <a href="#" class="btn btn-primary w-100">
                        Register
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
