<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Reports - CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .navbar {
            background: #212529;
        }

        .stat-card {
            border: 0;
            border-radius: 12px;
        }

        .report-card {
            border: 0;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <span class="navbar-brand fw-bold">
            CampusConnect - Reports
        </span>

        <a href="/admin/dashboard"
           class="btn btn-light">
            Dashboard
        </a>

    </div>
</nav>


<div class="container mt-4">

    <h2 class="fw-bold mb-1">
        Reports
    </h2>

    <p class="text-muted">
        Generate and filter event management reports.
    </p>


    <!-- DATE FILTER -->

    <div class="card report-card shadow-sm mb-4">

        <div class="card-body">

            <h5 class="fw-bold mb-3">
                Generate Report
            </h5>

            <form method="get"
                  action="/admin/reports">

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">
                            Start Date
                        </label>

                        <input
                            type="date"
                            name="startDate"
                            class="form-control"
                            th:value="${startDate}">
                    </div>


                    <div class="col-md-4">

                        <label class="form-label">
                            End Date
                        </label>

                        <input
                            type="date"
                            name="endDate"
                            class="form-control"
                            th:value="${endDate}">
                    </div>


                    <div class="col-md-4 d-flex align-items-end">

                        <button
    type="submit"
    class="btn btn-primary me-2">
    Filter Report
</button>

<button
    type="button"
    class="btn btn-success"
    onclick="downloadReport()">
    Download PDF
</button>

<script>
function downloadReport() {

    const startDate =
        document.querySelector('input[name="startDate"]').value;

    const endDate =
        document.querySelector('input[name="endDate"]').value;

    if (!startDate || !endDate) {
        alert("Please select Start Date and End Date first.");
        return;
    }

    window.location.href =
        "/admin/reports/pdf?startDate="
        + startDate
        + "&endDate="
        + endDate;
}
</script>

                        <a href="/admin/reports"
                           class="btn btn-outline-secondary">
                            Reset
                        </a>

                    </div>

                </div>

            </form>

        </div>

    </div>


    <!-- STATISTICS -->

    <div class="row g-3 mb-4">

        <div class="col-md-3">

            <div class="card stat-card shadow-sm">
                <div class="card-body">

                    <h6 class="text-muted">
                        Students
                    </h6>

                    <h2 th:text="${studentCount}">
                        0
                    </h2>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card stat-card shadow-sm">
                <div class="card-body">

                    <h6 class="text-muted">
                        Events
                    </h6>

                    <h2 th:text="${eventCount}">
                        0
                    </h2>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card stat-card shadow-sm">
                <div class="card-body">

                    <h6 class="text-muted">
                        Activities
                    </h6>

                    <h2 th:text="${subEventCount}">
                        0
                    </h2>

                </div>
            </div>

        </div>


        <div class="col-md-3">

            <div class="card stat-card shadow-sm">
                <div class="card-body">

                    <h6 class="text-muted">
                        Registrations
                    </h6>

                    <h2 th:text="${registrationCount}">
                        0
                    </h2>

                </div>
            </div>

        </div>

    </div>


    <!-- EVENT REPORT -->

    <div class="card report-card shadow-sm">

        <div class="card-body">

            <h5 class="fw-bold mb-3">
                Event Registration Report
            </h5>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>
                        <th>Event</th>
                        <th>Venue</th>
                        <th>Registrations</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="event : ${events}">

                        <td th:text="${event.eventName}">
                            Event
                        </td>

                        <td th:text="${event.venue}">
                            Venue
                        </td>

                        <td>

                            <span
                                class="badge bg-primary"
                                th:text="${registrationCounts[event.eventId]}">
                                0
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(events)}">

                        <td colspan="3"
                            class="text-center text-muted">

                            No events found.

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
