<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrations - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <div>
            <a href="/admin/dashboard" class="btn btn-light me-2">Dashboard</a>
            <a href="/admin/logout" class="btn btn-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <h2 class="mb-4">Student Registrations</h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-light">
                <tr>
                    <th>Registration ID</th>
                    <th>Student ID</th>
                    <th>Student</th>
                    <th>Event</th>
                    <th>Sub Event</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="reg : ${registrations}">

                    <td th:text="${reg.registrationId}"></td>

                     <td>
                        <span th:each="s : ${students}"
                              th:if="${s.studentId == reg.studentId}"
                              th:text="${s.studentId}">
                        </span>
                    </td>


                    <!-- Student Name -->
                    <td>
                        <span th:each="s : ${students}"
                              th:if="${s.studentId == reg.studentId}"
                              th:text="${s.studentName}">
                        </span>
                    </td>

                    <!-- Event Name -->
                    <td>
                        <span th:each="e : ${events}"
                              th:if="${e.eventId == reg.eventId}"
                              th:text="${e.eventName}">
                        </span>
                    </td>

                    <!-- Sub Event Name -->
                    <td>
                        <span th:each="sub : ${subEvents}"
                              th:if="${sub.subEventId == reg.subEventId}"
                              th:text="${sub.subEventName}">
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
