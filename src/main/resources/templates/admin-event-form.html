<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Event - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <a href="/admin/events" class="btn btn-light">
            Back
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <h2 class="mb-4"
                th:text="${event.eventId == 0 ? 'Add Event' : 'Edit Event'}">
                Add Event
            </h2>

            <form th:action="${event.eventId == 0 ? '/admin/events/save' : '/admin/events/update'}"
                  method="post">

                <input type="hidden"
                       name="eventId"
                       th:value="${event.eventId}">

                <!-- Event Name -->
                <div class="mb-3">
                    <label class="form-label">
                        Event Name
                    </label>

                    <input type="text"
                           name="eventName"
                           class="form-control"
                           th:value="${event.eventName}"
                           required>
                </div>

                <!-- Venue -->
                <div class="mb-3">
                    <label class="form-label">
                        Venue
                    </label>

                    <input type="text"
                           name="venue"
                           class="form-control"
                           th:value="${event.venue}"
                           required>
                </div>

                <!-- Start Date & Time -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Start Date
                        </label>

                        <input type="date"
                               name="startDate"
                               class="form-control"
                               th:value="${event.startDateTime != null ? #temporals.format(event.startDateTime, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Start Time
                        </label>

                        <input type="time"
                               name="startTime"
                               class="form-control"
                               th:value="${event.startDateTime != null ? #temporals.format(event.startDateTime, 'HH:mm') : ''}"
                               required>
                    </div>

                </div>

                <!-- End Date & Time -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            End Date
                        </label>

                        <input type="date"
                               name="endDate"
                               class="form-control"
                               th:value="${event.endDateTime != null ? #temporals.format(event.endDateTime, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            End Time
                        </label>

                        <input type="time"
                               name="endTime"
                               class="form-control"
                               th:value="${event.endDateTime != null ? #temporals.format(event.endDateTime, 'HH:mm') : ''}"
                               required>
                    </div>

                </div>

                <!-- Image URL -->
                <div class="mb-3">
                    <label class="form-label">
                        Image URL
                    </label>

                    <input type="text"
                           name="imageUrl"
                           class="form-control"
                           th:value="${event.imageUrl}"
                           placeholder="/images/event.jpg">
                </div>

                <button type="submit"
                        class="btn btn-primary w-100"
                        th:text="${event.eventId == 0 ? 'Add Event' : 'Update Event'}">
                    Add Event
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
