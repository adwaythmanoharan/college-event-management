<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Students - CampusConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand">CampusConnect - Admin</span>

        <div>
            <a href="/admin/dashboard" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/admin/logout" class="btn btn-light">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Students</h2>

        <a href="/admin/students/add"
           class="btn btn-primary">
            + Add Student
        </a>
    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-bordered table-hover">

                <thead class="table-light">
                <tr>
                    <th>Student ID</th>
                    <th>Student Name</th>
                    <th>Department</th>
                    <th>Password</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="student : ${students}">

                    <td th:text="${student.studentId}"></td>

                    <td th:text="${student.studentName}"></td>
                    
                    <td th:text="${student.department}"></td>

                    <td th:text="${student.password}"></td>

                    <td>
                        <a th:href="@{/admin/students/delete(id=${student.studentId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to delete this student?');">
                            Delete
                        </a>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
