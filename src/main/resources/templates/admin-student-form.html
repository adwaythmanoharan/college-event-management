<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Add Student - CampusConnect</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <span class="navbar-brand fw-bold">
            CampusConnect - Admin
        </span>

        <a href="/admin/students"
           class="btn btn-light">
            Back
        </a>

    </div>

</nav>


<div class="container mt-5">

    <div class="card shadow-sm mx-auto"
         style="max-width: 550px;">

        <div class="card-body p-4">

            <h2 class="mb-4">
                Add Student
            </h2>

            <form action="/admin/students/save"
                  method="post">

                <div class="mb-3">

                    <label class="form-label">
                        Student Name
                    </label>

                    <input
                        type="text"
                        name="studentName"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Department
                    </label>

                    <input
                        type="text"
                        name="department"
                        class="form-control"
                        placeholder="MCA"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        placeholder="student@gmail.com"
                        required>

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Add Student

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
