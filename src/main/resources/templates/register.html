<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/event-list">
            CampusConnect
        </a>

        <a href="/event-list" class="btn btn-light btn-sm">
            Back to Events
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="card shadow-sm mx-auto" style="max-width: 500px;">

        <div class="card-body p-4">

            <h2 class="text-center mb-4">
                Event Registration
            </h2>

            <div class="mb-4">
                <h4 th:text="${event.eventName}">
                    Event Name
                </h4>

               

                <p class="text-muted mb-1">
                    <strong>Event ID:</strong>
                    <span th:text="${event.eventId}">1</span>
                </p>

                <p class="text-muted">
                    <strong>Venue:</strong>
                    <span th:text="${event.venue}">Venue</span>
                </p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}">
</div>

<h4 th:text="${subEvent.subEventName}">
    Vadamvali
</h4>

            <form action="/register" method="post">

                <input type="hidden"
                       name="eventId"
                       th:value="${event.eventId}">

                 <input type="hidden"
           name="subEventId"
           th:value="${subEvent.subEventId}">       

                <button type="submit"
                        class="btn btn-primary w-100">
                    Submit Registration
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
