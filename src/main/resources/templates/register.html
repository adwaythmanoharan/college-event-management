<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusConnect - Registration</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- ================= CUSTOM CSS ================= -->

    <style>

        body {

            background: #f5f7fb;

            color: #1f2937;

        }


        /* ================================================= */
        /* BACK BUTTON */
        /* ================================================= */

        .back-button {

            display: inline-block;

            margin-bottom: 20px;

            text-decoration: none;

            color: #0d6efd;

            font-weight: 600;

            font-size: 15px;

        }


        .back-button:hover {

            color: #084298;

        }


        /* ================================================= */
        /* REGISTRATION CARD */
        /* ================================================= */

        .registration-card {

            background: white;

            border: none;

            border-radius: 20px;

            overflow: hidden;

            box-shadow:
                    0 8px 30px rgba(0, 0, 0, 0.07);

        }


        /* ================================================= */
        /* CARD HEADER */
        /* ================================================= */

        .registration-header {

            background: linear-gradient(
                    135deg,
                    #0d6efd,
                    #4f8dfd
            );

            color: white;

            padding: 28px 32px;

        }


        .registration-header h2 {

            font-size: 27px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .registration-header p {

            margin: 0;

            opacity: 0.9;

            font-size: 14px;

        }


        /* ================================================= */
        /* CARD BODY */
        /* ================================================= */

        .registration-body {

            padding: 32px;

        }


        /* ================================================= */
        /* EVENT INFORMATION */
        /* ================================================= */

        .event-section {

            background: #f8faff;

            border: 1px solid #e9eef8;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 22px;

        }


        .event-label {

            color: #6b7280;

            font-size: 12px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 5px;

        }


        .event-name {

            font-size: 24px;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .event-venue {

            color: #6b7280;

            font-size: 14px;

        }


        /* ================================================= */
        /* ACTIVITY SECTION */
        /* ================================================= */

        .activity-section {

            border: 1px solid #e9eef8;

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 22px;

        }


        .activity-icon {

            width: 46px;

            height: 46px;

            background: #eaf2ff;

            border-radius: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            margin-bottom: 12px;

        }


        .activity-name {

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .activity-label {

            color: #6b7280;

            font-size: 13px;

        }


        /* ================================================= */
        /* STUDENT INFO */
        /* ================================================= */

        .student-section {

            background: #f8f9fa;

            border-radius: 12px;

            padding: 16px;

            margin-bottom: 22px;

        }


        .student-title {

            font-size: 13px;

            color: #6b7280;

            margin-bottom: 3px;

        }


        .student-name {

            font-weight: 600;

            font-size: 15px;

        }


        /* ================================================= */
        /* ERROR */
        /* ================================================= */

        .error-message {

            border-radius: 10px;

            margin-bottom: 20px;

        }


        /* ================================================= */
        /* BUTTON */
        /* ================================================= */

        .confirm-button {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 15px;

        }


        /* ================================================= */
        /* NOTE */
        /* ================================================= */

        .registration-note {

            text-align: center;

            color: #6b7280;

            font-size: 12px;

            margin-top: 14px;

            margin-bottom: 0;

        }


        /* ================================================= */
        /* MOBILE */
        /* ================================================= */

        @media (max-width: 576px) {

            .registration-body {

                padding: 22px;

            }


            .registration-header {

                padding: 24px;

            }

        }

    </style>

</head>


<body>


<!-- ===================================================== -->
<!-- NAVBAR -->
<!-- ===================================================== -->

<div th:replace="~{navbar :: studentNavbar}"></div>



<!-- ===================================================== -->
<!-- MAIN -->
<!-- ===================================================== -->

<div class="container py-5">


    <!-- ================================================= -->
    <!-- BACK BUTTON -->
    <!-- ================================================= -->

    <a th:href="@{/subevents(eventId=${event.eventId})}"
       class="back-button">

        ← Back to Activities

    </a>



    <!-- ================================================= -->
    <!-- REGISTRATION CARD -->
    <!-- ================================================= -->

    <div class="registration-card mx-auto"
         style="max-width: 650px;">


        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <div class="registration-header">

            <h2>

                Confirm Your Registration

            </h2>

            <p>

                Review the details below before registering.

            </p>

        </div>



        <!-- ================================================= -->
        <!-- BODY -->
        <!-- ================================================= -->

        <div class="registration-body">


            <!-- ================================================= -->
            <!-- ERROR -->
            <!-- ================================================= -->

            <div th:if="${error}"
                 class="alert alert-danger error-message"
                 th:text="${error}">

                Registration error

            </div>



            <!-- ================================================= -->
            <!-- EVENT -->
            <!-- ================================================= -->

            <div class="event-section">


                <div class="event-label">

                    Event

                </div>


                <div class="event-name"
                     th:text="${event.eventName}">

                    Onam

                </div>


                <div class="event-venue">

                    📍

                    <span th:text="${event.venue}">

                        MCA Hall

                    </span>

                </div>

            </div>



            <!-- ================================================= -->
            <!-- ACTIVITY -->
            <!-- ================================================= -->

            <div class="activity-section">


                <div class="activity-icon">

                    🎯

                </div>


                <div class="event-label">

                    Selected Activity

                </div>


                <div class="activity-name"
                     th:text="${subEvent.subEventName}">

                    Onam Games

                </div>


                <div class="activity-label">

                    Your registration will reserve a place
                    for this activity.

                </div>

            </div>



            <!-- ================================================= -->
            <!-- STUDENT -->
            <!-- ================================================= -->

            <div class="student-section">


                <div class="student-title">

                    Registering as

                </div>


                <div class="student-name"
                     th:text="${studentName}">

                    Adwayth

                </div>

            </div>



            <!-- ================================================= -->
            <!-- FORM -->
            <!-- ================================================= -->

            <form action="/register"
                  method="post">


                <!-- Event ID -->

                <input type="hidden"
                       name="eventId"
                       th:value="${event.eventId}">


                <!-- Sub-event ID -->

                <input type="hidden"
                       name="subEventId"
                       th:value="${subEvent.subEventId}">


                <!-- Confirm -->

                <button type="submit"
                        class="btn btn-primary confirm-button">

                    ✓ Confirm Registration

                </button>


            </form>


            <p class="registration-note">

                You can unregister later from
                <strong>My Registrations</strong>.

            </p>


        </div>

    </div>

</div>



<!-- ===================================================== -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
